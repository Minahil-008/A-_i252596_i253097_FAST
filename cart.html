<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - The Resin Realm</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/cart.css">
</head>
<body>
  <!-- Header -->
    <header class="header">
        <div class="container-fluid">
            <div class="row align-items-center">
                <div class="col-md-3 d-flex align-items-center">
                    <img src="/ai images/logo.png" alt="Logo" class="logo">
                    <span class="site-name">The Resin Realm</span>
                </div>
                <div class="col-md-6">
                    <div class="search-bar">
                        <input type="text" placeholder="Search for products">
                        <i class="fas fa-search"></i>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="header-icons">
                        <a href="#" class="icon-link"><i class="fas fa-user"></i> Account</a>
                        <a href="cart.html" class="icon-link">
                            <i class="fas fa-shopping-cart"></i> Cart
                            <span class="cart-count">2</span>
                        </a>
                        <a href="#" class="icon-link"><i class="fas fa-heart"></i> Wishlist</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Navigation -->
    <nav class="main-nav">
        <div class="container">
            <button class="menu-toggle">MENU:</button>
            <ul class="nav-links">
                <li><a href="home.html">HOME</a></li>
                <li><a href="products.html">PRODUCTS</a></li>
                <li><a href="#about">ABOUT</a></li>
                <li><a href="#contact">CONTACT</a></li>
            </ul>
        </div>
    </nav>

    <!-- Cart Content -->
    <div class="container my-5">
        <h1 class="page-title">Cart items:</h1>
        
        <div class="row">
            <div class="col-lg-8">
                <div id="cartItems" class="cart-items-container">
                    <!-- Cart items will be dynamically loaded here -->
                </div>
            </div>
            
            <div class="col-lg-4">
                <div class="price-summary">
                    <h2>TOTAL PRICE:</h2>
                    <div class="price-details">
                        <div class="price-row">
                            <span>Sub total:</span>
                            <span id="subtotal">PKR 0.00</span>
                        </div>
                        <div class="price-row">
                            <span>Tax:</span>
                            <span id="tax">PKR 0.00</span>
                        </div>
                        <div class="price-row">
                            <span>Shipping:</span>
                            <span id="shipping">PKR 500.00</span>
                        </div>
                        <div class="price-row total-row">
                            <span>Grand Total:</span>
                            <span id="grandTotal">PKR 0.00</span>
                        </div>
                    </div>
                    
                    <div class="action-buttons">
                        <button class="btn-action" id="saveLaterBtn">Save for later</button>
                        <button class="btn-action" id="continueShoppingBtn">Continue Shopping</button>
                        <button class="btn-checkout" id="checkoutBtn">Proceed to checkout</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>resinrealm@gmail.com</p>
            <p>&copy; 2024 The Resin Realm. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
